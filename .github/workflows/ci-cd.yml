name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build Debug
        run: ./gradlew test assembleDebug

  release-jitpack:
    name: Release & Trigger JitPack
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from build.gradle.kts
        id: extract_version
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' uxcomponentLib/build.gradle.kts)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check and Create Git Tag
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
          else
            echo "Creating tag $VERSION..."
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Tag $VERSION pushed successfully."
          fi

      - name: Trigger JitPack Build
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          echo "Triggering JitPack build for version: $VERSION"
          curl -s https://jitpack.io/com/github/spradhan7656/UxComponent/$VERSION/build
